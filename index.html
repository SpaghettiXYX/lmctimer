<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test and Exam Clock</title>
<style>
  /* ===== Rule 8: 正文 text-wrap: pretty ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; text-wrap: pretty; }

  /* ===== Rule 1: 4 层背景分层，1-3% 微明度，禁黑框与 #000 ===== */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%,   hsl(225, 30%, 3%) 0%, transparent 65%),
      radial-gradient(ellipse 60% 40% at 100% 100%, hsl(225, 30%, 2.5%) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 0% 100%,  hsl(225, 30%, 2%) 0%, transparent 55%),
      hsl(225, 30%, 1%);
  }

  /* ===== 横屏布局：左右分栏（Seewo 白板 16:9） ===== */
  .app {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(40px, 6vw, 100px);
    padding: clamp(20px, 4vh, 60px) clamp(30px, 5vw, 100px);
    transition: gap 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .left-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 2.5vh, 28px);
    transition: gap 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .right-panel {
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2.5vh, 32px);
    width: clamp(280px, 26vw, 380px);
    flex-shrink: 0;
    transition:
      width 0.7s cubic-bezier(0.22, 0.61, 0.36, 1),
      opacity 0.35s ease,
      transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1),
      filter 0.35s ease;
  }

  /* ===== Rule 3: 暗色字重全降 40 ===== */
  h1 {
    font-size: clamp(1.3rem, 2.2vw, 1.9rem);
    font-weight: 260;            /* 300 - 40 */
    letter-spacing: 0.25em;
    color: hsl(225, 15%, 85%);
    text-align: center;
  }

  /* ===== 时钟（信息在下方，不遮挡指针） ===== */
  .clock-container {
    --clock-size: clamp(320px, 46vh, 520px);
    position: relative;
    width: var(--clock-size);
    height: var(--clock-size);
    transition:
      width 0.75s cubic-bezier(0.22, 0.61, 0.36, 1),
      height 0.75s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  /* ===== 开考后：控制面板滑出隐藏，时钟放大居中 ===== */
  .app.running { gap: 0; }
  .app.running .right-panel {
    width: 0;
    opacity: 0;
    transform: translateX(48px);
    filter: blur(6px);
    pointer-events: none;
    overflow: hidden;
  }
  .app.running .clock-container {
    --clock-size: min(72vh, 52vw);
  }
  .app.running .left-panel {
    gap: clamp(10px, 1.6vh, 18px);
  }

  /* 考试信息放在时钟下方 */
  .exam-info {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .subject-display {
    font-size: clamp(0.95rem, 1.5vw, 1.2rem);
    font-weight: 360;            /* 400 - 40 */
    letter-spacing: 0.15em;
    color: hsl(225, 10%, 78%);
    min-height: 1.2em;
  }
  /* ===== Rule 6: tabular-nums 防抖 ===== */
  .time-block {
    display: flex;
    gap: clamp(20px, 2.5vw, 36px);
    margin-top: 2px;
  }
  .time-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .time-label {
    font-size: 0.7rem;
    font-weight: 360;
    letter-spacing: 0.2em;
    color: hsl(225, 10%, 50%);
    text-transform: uppercase;
  }
  .time-value {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: clamp(1.4rem, 2.4vw, 2rem);
    font-weight: 460;            /* 500 - 40 */
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: #fff;
    letter-spacing: 0.04em;
  }
  .status {
    font-size: 0.8rem;
    font-weight: 360;            /* 400 - 40 */
    letter-spacing: 0.25em;
    color: hsl(142, 60%, 65%);
    text-transform: uppercase;
    margin-top: 4px;
    min-height: 1.1em;
  }

  /* ===== 右侧控制面板 ===== */
  .panel-card {
    background: hsl(225, 25%, 7%);
    border: 1px solid hsl(225, 15%, 14%);
    border-radius: 16px;
    padding: clamp(16px, 2.2vh, 24px);
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2vh, 20px);
    width: clamp(280px, 26vw, 380px);
    flex-shrink: 0;
  }
  .field-label {
    font-size: 0.72rem;
    font-weight: 360;
    letter-spacing: 0.18em;
    color: hsl(225, 10%, 55%);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }

  input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid hsl(225, 15%, 18%);
    border-radius: 10px;
    background: hsl(225, 25%, 9%);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 360;            /* 400 - 40 */
    font-family: inherit;
    outline: none;
    transition: box-shadow 0.25s ease, background 0.25s ease;
  }
  input::placeholder { color: hsl(225, 10%, 42%); }
  /* ===== Rule 2: 聚焦禁描边，加深双环阴影 ===== */
  input:focus {
    border-color: transparent;
    outline: none;
    box-shadow:
      0 0 0 1px hsla(142, 70%, 60%, 0.85),
      0 0 0 5px hsla(142, 70%, 60%, 0.22),
      0 6px 24px hsla(0, 0%, 0%, 0.45);
    background: hsl(225, 25%, 11%);
  }
  input:disabled { opacity: 0.5; }

  /* ===== 科目下拉：自绘浮层（Rule 4 渐入 + Rule 7 Grid 折叠） ===== */
  .combo { position: relative; }
  .combo input { padding-right: 44px; }
  .combo-toggle {
    position: absolute;
    top: 1px; right: 1px;
    height: calc(100% - 2px);
    width: 40px;
    min-width: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 0 9px 9px 0;
    color: hsl(225, 10%, 52%);
    font-size: 0.72rem;
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .combo-toggle:hover {
    color: hsl(225, 10%, 82%);
    background: hsla(225, 45%, 45%, 0.16);
    transform: none;
  }
  .combo-toggle:active { transform: none; }
  .combo-toggle .icon {
    transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .combo.open .combo-toggle .icon {
    transform: translateY(0.125em) rotate(180deg);
  }

  .combo-menu {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 8px);
    z-index: 30;
    display: grid;
    grid-template-rows: 0fr;                 /* Rule 7: 0fr → 1fr 展开 */
    opacity: 0;
    filter: blur(6px);
    transform: translateY(-6px);
    visibility: hidden;
    pointer-events: none;
    transition:
      grid-template-rows 0.32s cubic-bezier(0.22, 0.61, 0.36, 1),
      opacity 0.2s ease,
      filter 0.2s ease,
      transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1),
      visibility 0s linear 0.32s;
  }
  .combo.open .combo-menu {
    grid-template-rows: 1fr;
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
    visibility: visible;
    pointer-events: auto;
    transition-delay: 0s;
  }
  .combo-inner {
    overflow: hidden;
    min-height: 0;
  }
  .combo-panel {
    max-height: min(46vh, 300px);
    overflow-y: auto;
    padding: 6px;
    border-radius: 12px;
    border: 1px solid hsl(225, 15%, 15%);
    background: hsl(225, 26%, 7%);
    box-shadow: 0 18px 44px hsla(225, 60%, 4%, 0.55);
    scrollbar-width: thin;
    scrollbar-color: hsl(225, 15%, 22%) transparent;
  }
  .combo-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: hsl(225, 10%, 72%);
    font-size: 0.88rem;
    font-weight: 360;                        /* 400 - 40 */
    letter-spacing: 0.02em;
    font-family: inherit;
    cursor: pointer;
    opacity: 0;                              /* Rule 4: 逐项 blur(6px) 渐显 */
  }
  .combo.open .combo-item {
    animation: fadeBlurIn 120ms ease forwards;
    animation-delay: calc(var(--i, 0) * 30ms);
  }
  .combo-item:hover,
  .combo-item.is-active {
    background: hsl(225, 22%, 13%);
    color: #fff;
    transform: none;
  }
  .combo-empty {
    padding: 12px;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 360;
    color: hsl(225, 10%, 45%);
  }

  /* ===== 时长滚动选择器（iOS 风格滚轮） ===== */
  .picker {
    position: relative;
    height: 180px;
    border-radius: 12px;
    background: hsl(225, 25%, 9%);
    border: 1px solid hsl(225, 15%, 18%);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom,
      transparent 0%, hsl(0,0%,0%) 22%, hsl(0,0%,0%) 78%, transparent 100%);
    mask-image: linear-gradient(to bottom,
      transparent 0%, hsl(0,0%,0%) 22%, hsl(0,0%,0%) 78%, transparent 100%);
  }
  .picker-highlight {
    position: absolute;
    left: 8px; right: 8px;
    top: 50%;
    height: 44px;
    transform: translateY(-50%);
    border-radius: 8px;
    background: hsla(142, 70%, 60%, 0.10);
    border: 1px solid hsla(142, 70%, 60%, 0.35);
    pointer-events: none;
    z-index: 2;
  }
  .picker-list {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
    /* 容器 180px - 单项 44px = 136，上下各 68px 使首项居中 */
    padding: 68px 0;
  }
  .picker-list::-webkit-scrollbar { display: none; }
  .picker-item {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 360;
    color: hsl(225, 10%, 45%);
    scroll-snap-align: center;
    transition: color 0.2s ease, transform 0.2s ease;
    cursor: pointer;
    user-select: none;
  }
  .picker-item.active {
    color: #fff;
    font-weight: 460;            /* 500 - 40 */
    font-variant-numeric: tabular-nums;
  }
  .picker.disabled { opacity: 0.5; pointer-events: none; }

  button {
    background: hsl(142, 70%, 58%);
    color: hsl(225, 40%, 12%);
    font-weight: 560;            /* 600 - 40 */
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 1.05rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
  }
  button:hover { background: hsl(142, 70%, 50%); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.stop { background: hsl(0, 85%, 68%); color: #fff; }
  button.stop:hover { background: hsl(0, 85%, 60%); }

  /* ===== 开考后的浮动 End（面板已隐藏，保留退出入口） ===== */
  .float-end {
    position: fixed;
    left: clamp(16px, 2.4vw, 34px);
    bottom: clamp(14px, 2vh, 26px);
    width: auto;
    padding: 10px 22px;
    border: 1px solid hsla(0, 85%, 68%, 0.32);
    border-radius: 999px;
    background: hsla(0, 65%, 40%, 0.16);
    color: hsl(0, 85%, 76%);
    font-size: 0.8rem;
    font-weight: 460;
    letter-spacing: 0.14em;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    z-index: 12;
    transition:
      opacity 0.4s ease,
      transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1),
      background 0.25s ease,
      color 0.25s ease;
  }
  .app.running .float-end {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition-delay: 0.5s, 0.5s, 0s, 0s;
  }
  .float-end:hover {
    background: hsla(0, 70%, 48%, 0.3);
    color: hsl(0, 90%, 88%);
  }

  /* ===== Rule 5: 图标下移 0.125em 对齐 ===== */
  .icon {
    display: inline-block;
    transform: translateY(0.125em);
    font-style: normal;
    line-height: 1;
  }

  /* ===== Rule 7: 折叠用 Grid 0fr → 1fr ===== */
  .grid-collapse {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.35s ease;
    overflow: hidden;
  }
  .grid-collapse.collapsed { grid-template-rows: 0fr; }
  .grid-collapse > .grid-inner {
    overflow: hidden;
    min-height: 0;
  }

  .time-server-info {
    font-size: 0.72rem;
    color: hsl(225, 10%, 48%);
    letter-spacing: 0.1em;
    text-align: center;
    margin-top: 4px;
  }
  /* ===== Rule 6: 数字 tabular-nums ===== */
  .credit {
    position: fixed;
    right: clamp(14px, 2vw, 30px);
    bottom: clamp(10px, 1.6vh, 20px);
    font-size: 0.66rem;
    font-weight: 460;
    letter-spacing: 0.14em;
    font-variant-numeric: tabular-nums;
    color: hsl(225, 10%, 36%);
    user-select: none;
    transition: color 0.25s ease;
    z-index: 10;
  }
  .credit a {
    color: inherit;
    text-decoration: none;
    transition: color 0.25s ease;
  }
  .credit:hover { color: hsl(225, 12%, 56%); }
  .credit a:hover { color: hsl(217, 70%, 72%); }

  .bell-indicator {
    position: absolute;
    top: 6px; right: 6px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: hsl(142, 70%, 58%);
    display: none;
    z-index: 5;
  }
  .bell-indicator.active {
    display: block;
    animation: pulse 0.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
  }

  /* ===== Rule 4: 流式打字 blur(6px) 渐显，120ms + 30ms 字间错开 ===== */
  @keyframes fadeBlurIn {
    from { opacity: 0; filter: blur(6px); transform: translateY(2px); }
    to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
  }
  .tw-char {
    display: inline-block;
    opacity: 0;
    filter: blur(6px);
    animation: fadeBlurIn 120ms ease forwards;
  }

  /* 窄屏降级为上下布局 */
  @media (max-aspect-ratio: 1/1) and (max-width: 768px) {
    .app {
      flex-direction: column;
      gap: 24px;
      padding: 20px;
    }
    .right-panel { width: 100%; max-width: 360px; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- 左侧：时钟 + 考试信息 -->
    <div class="left-panel">
      <h1 id="title">Test and Exam Clock</h1>
      <div class="clock-container">
        <canvas id="clock" width="520" height="520"></canvas>
        <div class="bell-indicator" id="bellIndicator"></div>
      </div>
      <div class="exam-info">
        <div class="subject-display" id="subjectDisplay"></div>
        <div class="time-block">
          <div class="time-row"><span class="time-label">Start</span><span class="time-value" id="startTime">--:--:--</span></div>
          <div class="time-row"><span class="time-label">End</span><span class="time-value" id="endTime">--:--:--</span></div>
        </div>
        <div class="status" id="status"></div>
      </div>
      <div class="time-server-info">
        Synced with Apple Time Server (time.apple.com)
      </div>
    </div>

    <!-- 右侧：控制面板 -->
    <div class="right-panel">
      <div class="panel-card">
        <div>
          <label class="field-label">Subject</label>
          <div class="combo" id="subjectCombo">
            <input type="text" id="subject" placeholder="Enter subject name" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="comboMenu">
            <button type="button" class="combo-toggle" id="comboToggle" aria-label="Show subject list" tabindex="-1"><i class="icon">▾</i></button>
            <div class="combo-menu" id="comboMenu">
              <div class="combo-inner">
                <div class="combo-panel" id="comboPanel"></div>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label class="field-label">Duration</label>
          <div class="picker" id="durationPicker">
            <div class="picker-highlight"></div>
            <div class="picker-list" id="pickerList"></div>
          </div>
        </div>

        <!-- Rule 7: Grid 0fr→1fr 折叠切换 -->
        <div class="grid-collapse" id="startWrap">
          <div class="grid-inner">
            <button id="startBtn"><i class="icon">▶</i>Start</button>
          </div>
        </div>
        <div class="grid-collapse collapsed" id="stopWrap">
          <div class="grid-inner">
            <button id="stopBtn" class="stop"><i class="icon">■</i>End</button>
          </div>
        </div>
      </div>
    </div>
    <button class="float-end" id="floatEndBtn"><i class="icon">■</i>End</button>
  </div>

  <div class="credit">© 2025-2026 <a href="https://github.com/spaghettixyx" target="_blank" rel="noopener">spaghettixyx</a></div>

<script>
/* ===== Rule 4: 流式打字引擎 ===== */
function typewriter(el, text) {
  el.textContent = '';
  Array.from(text).forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'tw-char';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 30) + 'ms';
    el.appendChild(span);
  });
}

/* ===== Subject dropdown (custom, animated) ===== */
const SUBJECTS = [
  'Chinese Language', 'English Language', 'Mathematics', 'Liberal Studies',
  'Physics', 'Chemistry', 'Biology', 'Economics', 'Accounting', 'Geography', 'History'
];
const comboEl = document.getElementById('subjectCombo');
const comboPanel = document.getElementById('comboPanel');
const comboInput = document.getElementById('subject');
const comboToggle = document.getElementById('comboToggle');

function renderComboItems(keyword) {
  const kw = (keyword || '').trim().toLowerCase();
  const matches = SUBJECTS.filter(s => s.toLowerCase().includes(kw));
  comboPanel.innerHTML = '';
  if (!matches.length) {
    const empty = document.createElement('div');
    empty.className = 'combo-empty';
    empty.textContent = 'No matching subject';
    comboPanel.appendChild(empty);
    return;
  }
  matches.forEach((name, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'combo-item';
    btn.textContent = name;
    btn.style.setProperty('--i', i);   // Rule 4: 30ms 字间错开
    btn.addEventListener('click', () => {
      comboInput.value = name;
      closeCombo();
      comboInput.blur();
    });
    comboPanel.appendChild(btn);
  });
}

function openCombo() {
  if (comboInput.disabled) return;
  if (!comboEl.classList.contains('open')) {
    renderComboItems(comboInput.value);
    comboEl.classList.add('open');
    comboInput.setAttribute('aria-expanded', 'true');
  }
}

function closeCombo() {
  comboEl.classList.remove('open');
  comboInput.setAttribute('aria-expanded', 'false');
}

comboToggle.addEventListener('click', () => {
  if (comboEl.classList.contains('open')) closeCombo();
  else { comboInput.focus(); openCombo(); }
});

comboInput.addEventListener('focus', openCombo);
comboInput.addEventListener('click', openCombo);
comboInput.addEventListener('input', () => {
  openCombo();
  renderComboItems(comboInput.value);
});

comboInput.addEventListener('keydown', (e) => {
  const items = comboPanel.querySelectorAll('.combo-item');
  if (e.key === 'Escape') { closeCombo(); comboInput.blur(); return; }
  if (e.key === 'ArrowDown' && items.length) {
    e.preventDefault();
    openCombo();
    const cur = comboPanel.querySelector('.combo-item.is-active');
    const next = cur && cur.nextElementSibling ? cur.nextElementSibling : items[0];
    items.forEach(it => it.classList.remove('is-active'));
    next.classList.add('is-active');
    next.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter') {
    const active = comboPanel.querySelector('.combo-item.is-active');
    if (active) { e.preventDefault(); active.click(); }
  }
});

document.addEventListener('click', (e) => {
  if (!comboEl.contains(e.target)) closeCombo();
});

/* ===== Duration scroll picker (15-min steps, 15min → 5hr) ===== */
const DURATIONS = (() => {
  const arr = [];
  const push = (m) => {
    const h = Math.floor(m / 60);
    const min = m % 60;
    let label;
    if (h === 0) label = `${min} min`;
    else if (min === 0) label = `${h} hr`;
    else label = `${h} hr ${min} min`;
    arr.push({ value: m, label });
  };
  // 8–15 分钟：每分钟一档（短测常用）
  for (let m = 8; m <= 15; m++) push(m);
  // 30 分钟起：每 15 分钟一档
  for (let m = 30; m <= 300; m += 15) push(m);
  return arr;
})();
const ITEM_HEIGHT = 44;
const pickerList = document.getElementById('pickerList');
const durationPicker = document.getElementById('durationPicker');

DURATIONS.forEach(d => {
  const div = document.createElement('div');
  div.className = 'picker-item';
  div.dataset.value = d.value;
  div.textContent = d.label;
  div.addEventListener('click', () => setDurationByValue(d.value, true));
  pickerList.appendChild(div);
});

let selectedDuration = 90; // default 1 hr 30 min

function updateActiveItem() {
  // 顶部 padding 68px 使首项居中，故索引 = round(scrollTop / itemHeight)
  const index = Math.round(pickerList.scrollTop / ITEM_HEIGHT);
  const items = pickerList.querySelectorAll('.picker-item');
  items.forEach((it, i) => it.classList.toggle('active', i === index));
  if (items[index]) selectedDuration = parseInt(items[index].dataset.value);
}

// 按「值」定位并选中，不依赖滚动位置，避免初始化时平滑滚动未完成导致默认值错位
function setDurationByValue(value, smooth) {
  const idx = DURATIONS.findIndex(d => d.value === value);
  if (idx < 0) return;
  selectedDuration = value;
  pickerList.querySelectorAll('.picker-item')
    .forEach((it, i) => it.classList.toggle('active', i === idx));
  if (smooth) pickerList.scrollTo({ top: idx * ITEM_HEIGHT, behavior: 'smooth' });
  else pickerList.scrollTop = idx * ITEM_HEIGHT;
}

let scrollTimer = null;
pickerList.addEventListener('scroll', () => {
  updateActiveItem();
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(snapToNearest, 120);
});
function snapToNearest() {
  const idx = Math.round(pickerList.scrollTop / ITEM_HEIGHT);
  pickerList.scrollTo({ top: idx * ITEM_HEIGHT, behavior: 'smooth' });
  updateActiveItem();
}

// 初始选中 90 分钟（等布局完成后再定位）
requestAnimationFrame(() => setDurationByValue(90, false));

// ==================== Analog Clock ====================
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');
const clockContainer = document.querySelector('.clock-container');
const BASE = 520;                      // 绘制基准坐标系
const centerX = BASE / 2, centerY = BASE / 2, radius = 230;

// 按容器实际尺寸 + devicePixelRatio 重设分辨率，放大后依然清晰
let canvasPx = 0;
function sizeCanvas() {
  const size = Math.max(120, Math.round(clockContainer.clientWidth));
  const dpr = window.devicePixelRatio || 1;
  const px = Math.round(size * dpr);
  if (px === canvasPx) return false;
  canvasPx = px;
  canvas.width = px;
  canvas.height = px;
  ctx.setTransform(px / BASE, 0, 0, px / BASE, 0, 0);
  return true;
}

function drawClock() {
  ctx.clearRect(0, 0, BASE, BASE);

  // Outer ring
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.lineWidth = 5;
  ctx.stroke();

  // Inner face
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius - 8, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fill();

  // Hour markers
  for (let i = 0; i < 12; i++) {
    const angle = (i * 30 - 90) * Math.PI / 180;
    const x1 = centerX + (radius - 22) * Math.cos(angle);
    const y1 = centerY + (radius - 22) * Math.sin(angle);
    const x2 = centerX + (radius - 38) * Math.cos(angle);
    const y2 = centerY + (radius - 38) * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = i % 3 === 0 ? '#fff' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = i % 3 === 0 ? 4 : 2;
    ctx.stroke();
  }

  // Minute markers
  for (let i = 0; i < 60; i++) {
    if (i % 5 !== 0) {
      const angle = (i * 6 - 90) * Math.PI / 180;
      const x1 = centerX + (radius - 22) * Math.cos(angle);
      const y1 = centerY + (radius - 22) * Math.sin(angle);
      const x2 = centerX + (radius - 28) * Math.cos(angle);
      const y2 = centerY + (radius - 28) * Math.sin(angle);
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // Numbers — Rule 3: 字重 560
  ctx.fillStyle = '#fff';
  ctx.font = '560 28px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 1; i <= 12; i++) {
    const angle = (i * 30 - 90) * Math.PI / 180;
    const x = centerX + (radius - 62) * Math.cos(angle);
    const y = centerY + (radius - 62) * Math.sin(angle);
    ctx.fillText(i, x, y);
  }

  const now = new Date();
  const hours = now.getHours() % 12;
  const minutes = now.getMinutes();
  const seconds = now.getSeconds();

  const hourAngle = ((hours + minutes / 60) * 30 - 90) * Math.PI / 180;
  drawHand(hourAngle, radius * 0.42, 8, '#fff');

  const minuteAngle = ((minutes + seconds / 60) * 6 - 90) * Math.PI / 180;
  drawHand(minuteAngle, radius * 0.62, 5, '#fff');

  const secondAngle = (seconds * 6 - 90) * Math.PI / 180;
  drawHand(secondAngle, radius * 0.72, 2.5, 'hsl(0, 85%, 68%)');

  ctx.beginPath();
  ctx.arc(centerX, centerY, 7, 0, 2 * Math.PI);
  ctx.fillStyle = 'hsl(0, 85%, 68%)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(centerX, centerY, 3, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

function drawHand(angle, length, width, color) {
  ctx.beginPath();
  ctx.moveTo(centerX, centerY);
  ctx.lineTo(centerX + length * Math.cos(angle), centerY + length * Math.sin(angle));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.stroke();
}

// ==================== Time Sync ====================
let timeOffset = 0;
async function syncTime() {
  try {
    const response = await fetch('https://worldtimeapi.org/api/timezone/Hong_Kong', { cache: 'no-store' });
    if (response.ok) {
      const data = await response.json();
      timeOffset = new Date(data.datetime).getTime() - Date.now();
    }
  } catch (e) { /* fallback to local */ }
}
function getSyncedTime() { return Date.now() + timeOffset; }

// ==================== Exam Timer ====================
let examEndTime = null, timerInterval = null, isExamRunning = false;

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const floatEndBtn = document.getElementById('floatEndBtn');
const appEl = document.querySelector('.app');
const subjectInput = document.getElementById('subject');
const subjectDisplay = document.getElementById('subjectDisplay');
const startTimeEl = document.getElementById('startTime');
const endTimeEl = document.getElementById('endTime');
const statusEl = document.getElementById('status');
const startWrap = document.getElementById('startWrap');
const stopWrap = document.getElementById('stopWrap');

function formatClockTime(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function setStatus(text, color) {
  statusEl.style.color = color;
  typewriter(statusEl, text);
}
function resetTimeDisplay() {
  startTimeEl.textContent = '--:--:--';
  endTimeEl.textContent = '--:--:--';
}

function checkExamEnd() {
  if (!isExamRunning || !examEndTime) return;
  if (examEndTime - getSyncedTime() <= 0) {
    isExamRunning = false;
    clearInterval(timerInterval);
    setStatus('FINISHED', 'hsl(0, 85%, 68%)');
    playAirbusBell();
    // 结束后时钟回位、控制面板滑回
    appEl.classList.remove('running');
    startWrap.classList.remove('collapsed');
    stopWrap.classList.add('collapsed');
    subjectInput.disabled = false;
    durationPicker.classList.remove('disabled');
  }
}

// 结束考试：面板滑回、时钟缩小复位
function stopExam() {
  isExamRunning = false;
  clearInterval(timerInterval);
  appEl.classList.remove('running');
  typewriter(subjectDisplay, 'Waiting');
  resetTimeDisplay();
  setStatus('READY', 'hsl(217, 90%, 70%)');
  subjectInput.disabled = false;
  durationPicker.classList.remove('disabled');
  startWrap.classList.remove('collapsed');
  stopWrap.classList.add('collapsed');
}

startBtn.addEventListener('click', () => {
  const subject = subjectInput.value.trim() || 'Exam';
  const examStartTime = getSyncedTime();
  examEndTime = examStartTime + selectedDuration * 60 * 1000;

  typewriter(subjectDisplay, subject);
  startTimeEl.textContent = formatClockTime(examStartTime);
  endTimeEl.textContent = formatClockTime(examEndTime);

  isExamRunning = true;
  setStatus('IN PROGRESS', 'hsl(142, 60%, 65%)');
  subjectInput.disabled = true;
  closeCombo();
  durationPicker.classList.add('disabled');
  startWrap.classList.add('collapsed');
  stopWrap.classList.remove('collapsed');
  // 控制面板滑出隐藏 + 时钟放大居中
  appEl.classList.add('running');

  timerInterval = setInterval(checkExamEnd, 1000);
});

stopBtn.addEventListener('click', stopExam);
floatEndBtn.addEventListener('click', stopExam);

// ==================== Airbus Takeoff Bell ====================
function playAirbusBell() {
  const indicator = document.getElementById('bellIndicator');
  indicator.classList.add('active');
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const bells = [
    { f: [880, 1175, 1568], delay: 0 },
    { f: [880, 1175, 1568], delay: 900 },
    { f: [880, 1175, 1568], delay: 1800 }
  ];
  bells.forEach(bell => {
    setTimeout(() => {
      const master = audioCtx.createGain();
      master.gain.value = 0;
      master.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      bell.f.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.15 / (i + 1), now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.connect(gain); gain.connect(master);
        osc.start(now); osc.stop(now + 0.8);
      });
      master.gain.setValueAtTime(0.6, now);
      master.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    }, bell.delay);
  });
  setTimeout(() => { indicator.classList.remove('active'); audioCtx.close(); }, 3000);
}

// ==================== Init ====================
sizeCanvas();
drawClock();
setInterval(drawClock, 1000);
syncTime();
setInterval(syncTime, 5 * 60 * 1000);

// 容器尺寸变化（放大/回缩、窗口调整）时同步画布分辨率
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    if (sizeCanvas()) drawClock();
  }).observe(clockContainer);
} else {
  window.addEventListener('resize', () => { if (sizeCanvas()) drawClock(); });
}

typewriter(document.getElementById('title'), 'Test and Exam Clock');
typewriter(subjectDisplay, 'Waiting');
setStatus('READY', 'hsl(217, 90%, 70%)');
</script>
