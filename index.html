<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test and Exam Clock</title>
<style>
  /* ===== Rule 8: 正文 text-wrap: pretty ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; text-wrap: pretty; }

  /* ===== Rule 1: 4 层背景分层，1-3% 微明度，禁黑框与 #000 ===== */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%,   hsl(225, 30%, 3%) 0%, transparent 65%),
      radial-gradient(ellipse 60% 40% at 100% 100%, hsl(225, 30%, 2.5%) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 0% 100%,  hsl(225, 30%, 2%) 0%, transparent 55%),
      hsl(225, 30%, 1%);
  }

  /* ===== 横屏布局：左右分栏（Seewo 白板 16:9） ===== */
  .app {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(40px, 6vw, 100px);
    padding: clamp(20px, 4vh, 60px) clamp(30px, 5vw, 100px);
  }
  .left-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 2.5vh, 28px);
  }
  .right-panel {
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2.5vh, 32px);
    width: clamp(280px, 26vw, 380px);
  }

  /* ===== Rule 3: 暗色字重全降 40 ===== */
  h1 {
    font-size: clamp(1.3rem, 2.2vw, 1.9rem);
    font-weight: 260;            /* 300 - 40 */
    letter-spacing: 0.25em;
    color: hsl(225, 15%, 85%);
    text-align: center;
  }

  /* ===== 时钟（信息在下方，不遮挡指针） ===== */
  .clock-container {
    position: relative;
    width: clamp(320px, 46vh, 520px);
    height: clamp(320px, 46vh, 520px);
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  /* 考试信息放在时钟下方 */
  .exam-info {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .subject-display {
    font-size: clamp(0.95rem, 1.5vw, 1.2rem);
    font-weight: 360;            /* 400 - 40 */
    letter-spacing: 0.15em;
    color: hsl(225, 10%, 78%);
    min-height: 1.2em;
  }
  /* ===== Rule 6: tabular-nums 防抖 ===== */
  .time-block {
    display: flex;
    gap: clamp(20px, 2.5vw, 36px);
    margin-top: 2px;
  }
  .time-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .time-label {
    font-size: 0.7rem;
    font-weight: 360;
    letter-spacing: 0.2em;
    color: hsl(225, 10%, 50%);
    text-transform: uppercase;
  }
  .time-value {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: clamp(1.4rem, 2.4vw, 2rem);
    font-weight: 460;            /* 500 - 40 */
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: #fff;
    letter-spacing: 0.04em;
  }
  .status {
    font-size: 0.8rem;
    font-weight: 360;            /* 400 - 40 */
    letter-spacing: 0.25em;
    color: hsl(142, 60%, 65%);
    text-transform: uppercase;
    margin-top: 4px;
    min-height: 1.1em;
  }

  /* ===== 右侧控制面板 ===== */
  .panel-card {
    background: hsl(225, 25%, 7%);
    border: 1px solid hsl(225, 15%, 14%);
    border-radius: 16px;
    padding: clamp(16px, 2.2vh, 24px);
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2vh, 20px);
  }
  .field-label {
    font-size: 0.72rem;
    font-weight: 360;
    letter-spacing: 0.18em;
    color: hsl(225, 10%, 55%);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }

  input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid hsl(225, 15%, 18%);
    border-radius: 10px;
    background: hsl(225, 25%, 9%);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 360;            /* 400 - 40 */
    font-family: inherit;
    outline: none;
    transition: box-shadow 0.25s ease, background 0.25s ease;
  }
  input::placeholder { color: hsl(225, 10%, 42%); }
  /* ===== Rule 2: 聚焦禁描边，加深双环阴影 ===== */
  input:focus {
    border-color: transparent;
    outline: none;
    box-shadow:
      0 0 0 1px hsla(142, 70%, 60%, 0.85),
      0 0 0 5px hsla(142, 70%, 60%, 0.22),
      0 6px 24px hsla(0, 0%, 0%, 0.45);
    background: hsl(225, 25%, 11%);
  }
  input:disabled { opacity: 0.5; }

  /* ===== 时长滚动选择器（iOS 风格滚轮） ===== */
  .picker {
    position: relative;
    height: 180px;
    border-radius: 12px;
    background: hsl(225, 25%, 9%);
    border: 1px solid hsl(225, 15%, 18%);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom,
      transparent 0%, hsl(0,0%,0%) 22%, hsl(0,0%,0%) 78%, transparent 100%);
    mask-image: linear-gradient(to bottom,
      transparent 0%, hsl(0,0%,0%) 22%, hsl(0,0%,0%) 78%, transparent 100%);
  }
  .picker-highlight {
    position: absolute;
    left: 8px; right: 8px;
    top: 50%;
    height: 44px;
    transform: translateY(-50%);
    border-radius: 8px;
    background: hsla(142, 70%, 60%, 0.10);
    border: 1px solid hsla(142, 70%, 60%, 0.35);
    pointer-events: none;
    z-index: 2;
  }
  .picker-list {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
    /* 容器 180px - 单项 44px = 136，上下各 68px 使首项居中 */
    padding: 68px 0;
  }
  .picker-list::-webkit-scrollbar { display: none; }
  .picker-item {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 360;
    color: hsl(225, 10%, 45%);
    scroll-snap-align: center;
    transition: color 0.2s ease, transform 0.2s ease;
    cursor: pointer;
    user-select: none;
  }
  .picker-item.active {
    color: #fff;
    font-weight: 460;            /* 500 - 40 */
    font-variant-numeric: tabular-nums;
  }
  .picker.disabled { opacity: 0.5; pointer-events: none; }

  button {
    background: hsl(142, 70%, 58%);
    color: hsl(225, 40%, 12%);
    font-weight: 560;            /* 600 - 40 */
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 1.05rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
  }
  button:hover { background: hsl(142, 70%, 50%); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.stop { background: hsl(0, 85%, 68%); color: #fff; }
  button.stop:hover { background: hsl(0, 85%, 60%); }

  /* ===== Rule 5: 图标下移 0.125em 对齐 ===== */
  .icon {
    display: inline-block;
    transform: translateY(0.125em);
    font-style: normal;
    line-height: 1;
  }

  /* ===== Rule 7: 折叠用 Grid 0fr → 1fr ===== */
  .grid-collapse {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.35s ease;
    overflow: hidden;
  }
  .grid-collapse.collapsed { grid-template-rows: 0fr; }
  .grid-collapse > .grid-inner {
    overflow: hidden;
    min-height: 0;
  }

  .time-server-info {
    font-size: 0.72rem;
    color: hsl(225, 10%, 48%);
    letter-spacing: 0.1em;
    text-align: center;
    margin-top: 4px;
  }
  /* ===== Rule 6: 数字 tabular-nums ===== */
  .digital-time {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    color: hsl(225, 10%, 60%);
    margin-top: 4px;
  }
  .credit {
    margin-top: 8px;
    font-size: 0.72rem;
    color: hsl(225, 10%, 45%);
    letter-spacing: 0.05em;
  }
  .credit a {
    color: hsl(217, 70%, 70%);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .credit a:hover { color: hsl(217, 80%, 85%); }

  .bell-indicator {
    position: absolute;
    top: 6px; right: 6px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: hsl(142, 70%, 58%);
    display: none;
    z-index: 5;
  }
  .bell-indicator.active {
    display: block;
    animation: pulse 0.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
  }

  /* ===== Rule 4: 流式打字 blur(6px) 渐显，120ms + 30ms 字间错开 ===== */
  @keyframes fadeBlurIn {
    from { opacity: 0; filter: blur(6px); transform: translateY(2px); }
    to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
  }
  .tw-char {
    display: inline-block;
    opacity: 0;
    filter: blur(6px);
    animation: fadeBlurIn 120ms ease forwards;
  }

  /* 窄屏降级为上下布局 */
  @media (max-aspect-ratio: 1/1) and (max-width: 768px) {
    .app {
      flex-direction: column;
      gap: 24px;
      padding: 20px;
    }
    .right-panel { width: 100%; max-width: 360px; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- 左侧：时钟 + 考试信息 -->
    <div class="left-panel">
      <h1 id="title">Test and Exam Clock</h1>
      <div class="clock-container">
        <canvas id="clock" width="520" height="520"></canvas>
        <div class="bell-indicator" id="bellIndicator"></div>
      </div>
      <div class="exam-info">
        <div class="subject-display" id="subjectDisplay"></div>
        <div class="time-block">
          <div class="time-row"><span class="time-label">Start</span><span class="time-value" id="startTime">--:--</span></div>
          <div class="time-row"><span class="time-label">End</span><span class="time-value" id="endTime">--:--</span></div>
        </div>
        <div class="status" id="status"></div>
      </div>
      <div class="time-server-info">
        Synced with Apple Time Server (time.apple.com)
        <div class="digital-time" id="digitalTime">--:--:--</div>
        <div class="credit">GitHub: <a href="https://github.com/spaghettixyx" target="_blank" rel="noopener">spaghettixyx</a></div>
      </div>
    </div>

    <!-- 右侧：控制面板 -->
    <div class="right-panel">
      <div class="panel-card">
        <div>
          <label class="field-label">Subject</label>
          <input type="text" id="subject" placeholder="Enter subject name" list="subjectList">
          <datalist id="subjectList">
            <option value="Chinese Language"></option>
            <option value="English Language"></option>
            <option value="Mathematics"></option>
            <option value="Liberal Studies"></option>
            <option value="Physics"></option>
            <option value="Chemistry"></option>
            <option value="Biology"></option>
            <option value="Economics"></option>
            <option value="Accounting"></option>
            <option value="Geography"></option>
            <option value="History"></option>
          </datalist>
        </div>

        <div>
          <label class="field-label">Duration</label>
          <div class="picker" id="durationPicker">
            <div class="picker-highlight"></div>
            <div class="picker-list" id="pickerList"></div>
          </div>
        </div>

        <!-- Rule 7: Grid 0fr→1fr 折叠切换 -->
        <div class="grid-collapse" id="startWrap">
          <div class="grid-inner">
            <button id="startBtn"><i class="icon">▶</i>Start</button>
          </div>
        </div>
        <div class="grid-collapse collapsed" id="stopWrap">
          <div class="grid-inner">
            <button id="stopBtn" class="stop"><i class="icon">■</i>End</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ===== Rule 4: 流式打字引擎 ===== */
function typewriter(el, text) {
  el.textContent = '';
  Array.from(text).forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'tw-char';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 30) + 'ms';
    el.appendChild(span);
  });
}

/* ===== Duration scroll picker (15-min steps, 15min → 5hr) ===== */
const DURATIONS = (() => {
  const arr = [];
  for (let m = 15; m <= 300; m += 15) {
    const h = Math.floor(m / 60);
    const min = m % 60;
    let label;
    if (h === 0) label = `${min} min`;
    else if (min === 0) label = `${h} hr`;
    else label = `${h} hr ${min} min`;
    arr.push({ value: m, label });
  }
  return arr;
})();
const ITEM_HEIGHT = 44;
const pickerList = document.getElementById('pickerList');
const durationPicker = document.getElementById('durationPicker');

DURATIONS.forEach(d => {
  const div = document.createElement('div');
  div.className = 'picker-item';
  div.dataset.value = d.value;
  div.textContent = d.label;
  div.addEventListener('click', () => scrollToValue(d.value));
  pickerList.appendChild(div);
});

let selectedDuration = 90; // default 1 hr 30 min

function updateActiveItem() {
  // 顶部 padding 68px 使首项居中，故索引 = round(scrollTop / itemHeight)
  const index = Math.round(pickerList.scrollTop / ITEM_HEIGHT);
  const items = pickerList.querySelectorAll('.picker-item');
  items.forEach((it, i) => it.classList.toggle('active', i === index));
  if (items[index]) selectedDuration = parseInt(items[index].dataset.value);
}

function scrollToValue(value) {
  const idx = DURATIONS.findIndex(d => d.value === value);
  if (idx < 0) return;
  pickerList.scrollTo({ top: idx * ITEM_HEIGHT, behavior: 'smooth' });
}

let scrollTimer = null;
pickerList.addEventListener('scroll', () => {
  updateActiveItem();
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(snapToNearest, 120);
});
function snapToNearest() {
  const idx = Math.round(pickerList.scrollTop / ITEM_HEIGHT);
  pickerList.scrollTo({ top: idx * ITEM_HEIGHT, behavior: 'smooth' });
  updateActiveItem();
}

// 初始选中 90 分钟
scrollToValue(90);
setTimeout(updateActiveItem, 100);

// ==================== Analog Clock ====================
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');
const SIZE = 520;
const centerX = SIZE / 2, centerY = SIZE / 2, radius = 230;

function drawClock() {
  ctx.clearRect(0, 0, SIZE, SIZE);

  // Outer ring
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.lineWidth = 5;
  ctx.stroke();

  // Inner face
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius - 8, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fill();

  // Hour markers
  for (let i = 0; i < 12; i++) {
    const angle = (i * 30 - 90) * Math.PI / 180;
    const x1 = centerX + (radius - 22) * Math.cos(angle);
    const y1 = centerY + (radius - 22) * Math.sin(angle);
    const x2 = centerX + (radius - 38) * Math.cos(angle);
    const y2 = centerY + (radius - 38) * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = i % 3 === 0 ? '#fff' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = i % 3 === 0 ? 4 : 2;
    ctx.stroke();
  }

  // Minute markers
  for (let i = 0; i < 60; i++) {
    if (i % 5 !== 0) {
      const angle = (i * 6 - 90) * Math.PI / 180;
      const x1 = centerX + (radius - 22) * Math.cos(angle);
      const y1 = centerY + (radius - 22) * Math.sin(angle);
      const x2 = centerX + (radius - 28) * Math.cos(angle);
      const y2 = centerY + (radius - 28) * Math.sin(angle);
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // Numbers — Rule 3: 字重 560
  ctx.fillStyle = '#fff';
  ctx.font = '560 28px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 1; i <= 12; i++) {
    const angle = (i * 30 - 90) * Math.PI / 180;
    const x = centerX + (radius - 62) * Math.cos(angle);
    const y = centerY + (radius - 62) * Math.sin(angle);
    ctx.fillText(i, x, y);
  }

  const now = new Date();
  const hours = now.getHours() % 12;
  const minutes = now.getMinutes();
  const seconds = now.getSeconds();

  const hourAngle = ((hours + minutes / 60) * 30 - 90) * Math.PI / 180;
  drawHand(hourAngle, radius * 0.42, 8, '#fff');

  const minuteAngle = ((minutes + seconds / 60) * 6 - 90) * Math.PI / 180;
  drawHand(minuteAngle, radius * 0.62, 5, '#fff');

  const secondAngle = (seconds * 6 - 90) * Math.PI / 180;
  drawHand(secondAngle, radius * 0.72, 2.5, 'hsl(0, 85%, 68%)');

  ctx.beginPath();
  ctx.arc(centerX, centerY, 7, 0, 2 * Math.PI);
  ctx.fillStyle = 'hsl(0, 85%, 68%)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(centerX, centerY, 3, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();

  document.getElementById('digitalTime').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}

function drawHand(angle, length, width, color) {
  ctx.beginPath();
  ctx.moveTo(centerX, centerY);
  ctx.lineTo(centerX + length * Math.cos(angle), centerY + length * Math.sin(angle));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.stroke();
}

// ==================== Time Sync ====================
let timeOffset = 0;
async function syncTime() {
  try {
    const response = await fetch('https://worldtimeapi.org/api/timezone/Hong_Kong', { cache: 'no-store' });
    if (response.ok) {
      const data = await response.json();
      timeOffset = new Date(data.datetime).getTime() - Date.now();
    }
  } catch (e) { /* fallback to local */ }
}
function getSyncedTime() { return Date.now() + timeOffset; }

// ==================== Exam Timer ====================
let examEndTime = null, timerInterval = null, isExamRunning = false;

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const subjectInput = document.getElementById('subject');
const subjectDisplay = document.getElementById('subjectDisplay');
const startTimeEl = document.getElementById('startTime');
const endTimeEl = document.getElementById('endTime');
const statusEl = document.getElementById('status');
const startWrap = document.getElementById('startWrap');
const stopWrap = document.getElementById('stopWrap');

function formatClockTime(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function setStatus(text, color) {
  statusEl.style.color = color;
  typewriter(statusEl, text);
}
function resetTimeDisplay() {
  startTimeEl.textContent = '--:--';
  endTimeEl.textContent = '--:--';
}

function checkExamEnd() {
  if (!isExamRunning || !examEndTime) return;
  if (examEndTime - getSyncedTime() <= 0) {
    isExamRunning = false;
    clearInterval(timerInterval);
    setStatus('FINISHED', 'hsl(0, 85%, 68%)');
    playAirbusBell();
    startWrap.classList.remove('collapsed');
    stopWrap.classList.add('collapsed');
    subjectInput.disabled = false;
    durationPicker.classList.remove('disabled');
  }
}

startBtn.addEventListener('click', () => {
  const subject = subjectInput.value.trim() || 'Exam';
  const examStartTime = getSyncedTime();
  examEndTime = examStartTime + selectedDuration * 60 * 1000;

  typewriter(subjectDisplay, subject);
  startTimeEl.textContent = formatClockTime(examStartTime);
  endTimeEl.textContent = formatClockTime(examEndTime);

  isExamRunning = true;
  setStatus('IN PROGRESS', 'hsl(142, 60%, 65%)');
  subjectInput.disabled = true;
  durationPicker.classList.add('disabled');
  startWrap.classList.add('collapsed');
  stopWrap.classList.remove('collapsed');

  timerInterval = setInterval(checkExamEnd, 1000);
});

stopBtn.addEventListener('click', () => {
  isExamRunning = false;
  clearInterval(timerInterval);
  typewriter(subjectDisplay, 'Waiting');
  resetTimeDisplay();
  setStatus('READY', 'hsl(217, 90%, 70%)');
  subjectInput.disabled = false;
  durationPicker.classList.remove('disabled');
  startWrap.classList.remove('collapsed');
  stopWrap.classList.add('collapsed');
});

// ==================== Airbus Takeoff Bell ====================
function playAirbusBell() {
  const indicator = document.getElementById('bellIndicator');
  indicator.classList.add('active');
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const bells = [
    { f: [880, 1175, 1568], delay: 0 },
    { f: [880, 1175, 1568], delay: 900 },
    { f: [880, 1175, 1568], delay: 1800 }
  ];
  bells.forEach(bell => {
    setTimeout(() => {
      const master = audioCtx.createGain();
      master.gain.value = 0;
      master.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      bell.f.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.15 / (i + 1), now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.connect(gain); gain.connect(master);
        osc.start(now); osc.stop(now + 0.8);
      });
      master.gain.setValueAtTime(0.6, now);
      master.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    }, bell.delay);
  });
  setTimeout(() => { indicator.classList.remove('active'); audioCtx.close(); }, 3000);
}

// ==================== Init ====================
drawClock();
setInterval(drawClock, 1000);
syncTime();
setInterval(syncTime, 5 * 60 * 1000);

typewriter(document.getElementById('title'), 'Test and Exam Clock');
typewriter(subjectDisplay, 'Waiting');
setStatus('READY', 'hsl(217, 90%, 70%)');
</script>
